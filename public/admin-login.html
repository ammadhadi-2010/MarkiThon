<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super Admin Login · MarkiThon</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/css/auth-pages.css?v=logo1">
    <link rel="stylesheet" href="/css/password-toggle.css?v=pw1">
</head>
<body class="auth-page">
    <form class="auth-card" id="authForm" autocomplete="off">
        <div class="auth-brand"><img class="auth-logo" src="/assets/logo.png" alt="MarkiThon"><strong>MarkiThon</strong></div>
        <h1>Super Admin Login</h1>
        <p>Sign in with the Super Admin account (role: admin) to open the dashboard.</p>
        <p class="auth-error" id="authError"></p>
        <label>Email<input id="authEmail" name="adminEmail" type="email" autocomplete="username" placeholder="markithon.official@gmail.com" value="markithon.official@gmail.com" required></label>
        <label>Password<input id="authPassword" name="adminPassword" type="password" autocomplete="current-password" placeholder="Admin@MarkiThon2026" required></label>
        <button type="submit">Sign In</button>
        <div class="auth-links"><a href="/login">Unified login</a><a href="/">View Marketplace</a></div>
    </form>
    <script src="/js/cloud-config.js?v=cloud1"></script>
    <script src="/js/api-base.js?v=cloud1"></script>
    <script src="/js/auth-client.js?v=cloud1"></script>
    <script src="/js/password-toggle.js?v=pw1"></script>
    <script src="/js/auth-admin-login.js?v=role1"></script>
</body>
</html>
