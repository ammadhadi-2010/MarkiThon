<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In · MarkiThon</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/css/auth-pages.css?v=logo1">
    <link rel="stylesheet" href="/css/password-toggle.css?v=pw1">
</head>
<body class="auth-page">
    <form class="auth-card" id="authForm" autocomplete="off">
        <div class="auth-brand"><img class="auth-logo" src="/assets/logo.png" alt="MarkiThon"><strong>MarkiThon</strong></div>
        <h1>Sign In</h1>
        <p>Sign in as Super Admin, shopkeeper, or customer. You will be routed to the right dashboard.</p>
        <p class="auth-error" id="authError"></p>
        <p class="auth-ok" id="authOk"></p>
        <label>Email<input id="authEmail" name="loginEmail" type="email" autocomplete="username" required></label>
        <label>Password<input id="authPassword" name="loginPassword" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign In</button>
        <div class="auth-links">
            <a href="/signup">Create customer account</a>
            <a href="/forgot-password">Forgot password</a>
        </div>
        <div class="auth-links">
            <a href="/vendor/login">Shopkeeper login</a>
            <a href="/admin/login">Admin login</a>
            <a href="/">Marketplace</a>
        </div>
    </form>
    <script src="/js/cloud-config.js?v=cloud1"></script>
    <script src="/js/api-base.js?v=cloud1"></script>
    <script src="/js/auth-client.js?v=cloud1"></script>
    <script src="/js/password-toggle.js?v=pw1"></script>
    <script src="/js/auth-unified-login.js?v=role1"></script>
</body>
</html>
