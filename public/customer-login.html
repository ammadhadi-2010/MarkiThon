<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Sign In · MarkiThon</title>
    <link rel="stylesheet" href="/css/auth-pages.css?v=auth1">
</head>
<body class="auth-page">
    <form class="auth-card" id="authForm" autocomplete="off">
        <div class="auth-brand"><span class="auth-mark">M</span><strong>MarkiThon</strong></div>
        <h1>Customer Sign In</h1>
        <p>Shop from verified local businesses like Ammad Hadi Stor.</p>
        <p class="auth-error" id="authError"></p>
        <label>Email<input id="authEmail" name="customerEmail" type="email" autocomplete="off" required></label>
        <label>Password<input id="authPassword" name="customerPassword" type="password" autocomplete="off" required></label>
        <button type="submit">Sign In</button>
        <div class="auth-links">
            <a href="/signup">Create account</a>
            <a href="/forgot-password">Forgot password</a>
        </div>
        <div class="auth-links"><a href="/">Back to Marketplace</a></div>
    </form>
    <script src="/js/cloud-config.js?v=cloud1"></script>
    <script src="/js/api-base.js?v=cloud1"></script>
    <script src="/js/auth-client.js?v=cloud1"></script>
    <script src="/js/auth-customer-login.js?v=auth1"></script>
</body>
</html>
