<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Sign Up · MarkiThon</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/css/auth-pages.css?v=logo1">
    <link rel="stylesheet" href="/css/password-toggle.css?v=pw1">
</head>
<body class="auth-page">
    <form class="auth-card" id="authForm" autocomplete="off">
        <div class="auth-brand"><img class="auth-logo" src="/assets/logo.png" alt="MarkiThon"><strong>MarkiThon</strong></div>
        <h1>Create Customer Account</h1>
        <p>Register with email and password to track orders and wishlist items.</p>
        <p class="auth-error" id="authError"></p>
        <label>Name<input id="authName" name="customerName" autocomplete="off" required></label>
        <label>Email<input id="authEmail" name="customerEmail" type="email" autocomplete="off" required></label>
        <label>Password<input id="authPassword" name="customerPassword" type="password" autocomplete="off" required></label>
        <button type="submit">Create Account</button>
        <div class="auth-links">
            <a href="/login">Already have an account?</a>
            <a href="/">Marketplace</a>
        </div>
    </form>
    <script src="/js/cloud-config.js?v=cloud1"></script>
    <script src="/js/api-base.js?v=cloud1"></script>
    <script src="/js/auth-client.js?v=cloud1"></script>
    <script src="/js/password-toggle.js?v=pw1"></script>
    <script src="/js/auth-customer-signup.js?v=auth1"></script>
</body>
</html>
